name: Browser baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Validate portable workspace
        run: npm run test:n02

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser baseline
        run: npm run test:baseline
