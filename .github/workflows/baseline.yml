name: Browser baseline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Validate portable workspace and mobile shell
        run: npm run test:n04

      - name: Bundle Android and iOS through Expo and Metro
        run: npm run test:mobile:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser baseline
        run: npm run test:baseline
